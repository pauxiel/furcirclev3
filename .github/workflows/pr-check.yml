name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-check-${{ github.head_ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # AI review stage (idea borrowed from no-mistakes' pipeline): reviews the
  # diff and posts findings as a PR comment. Runs in parallel with `check`
  # and also covers PRs opened by the bug-fix loop, so agent-written fixes
  # get a second agent's review before Paul's.
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-review-${{ github.head_ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record review start time
        run: echo "REVIEW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        # GH_TOKEN authenticates the `gh` CLI inside the agent's shell. Without
        # it `gh pr comment` fails silently and the review posts nothing (the
        # #38 failure). claude-code-action does not enable Bash by default, so
        # the gh commands are opt-in through the --allowedTools list below.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in this repo.

            Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`.
            Review ONLY the changed code, judged against the repo rules in
            CLAUDE.md. Focus, in priority order:

            1. Correctness bugs: logic errors, unhandled error paths, broken
               DynamoDB key patterns (see CLAUDE.md table), responses not
               going through src/lib/response.js helpers.
            2. Ownership enforcement: every dog/owner endpoint must verify
               `dog.ownerId === userId` from JWT claims before acting.
               Missing checks are a finding, always.
            3. Security: secrets in code, unvalidated user input reaching
               DynamoDB keys or S3 keys, IAM statements broader than the
               function needs.
            4. Tests: changed behavior without a covering test.

            Your REQUIRED final step, no matter what you find, is to post the
            review as a single sticky comment by running the `gh` CLI:

              gh pr comment ${{ github.event.pull_request.number }} \
                --edit-last --create-if-none --body "<your review>"

            `gh` is already authenticated via GH_TOKEN. `--edit-last
            --create-if-none` updates the previous review comment on re-runs
            instead of stacking a new one. The comment body must be:
            - Findings ordered by severity, each with file:line, what is
              wrong, and a concrete fix. Skip style nits and anything a
              linter or tsc already catches.
            - If nothing significant is found, still post: a one-line comment
              saying the review found no blocking issues.

            Do not end the session without running that command. Never push
            commits, never approve or request changes formally, never edit
            files - comment only.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Read,Glob,Grep"

      # Without this the #38 failure mode - job green, no comment - is silent.
      # Comparing against REVIEW_STARTED_AT means a stale comment left by an
      # earlier run does not count as this run having posted one.
      - name: Verify review comment posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          count=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login | startswith("github-actions"))
                      | select(.updated_at >= env.REVIEW_STARTED_AT)
                      | .id' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "AI review comment was not posted on PR #$PR_NUMBER" >&2
            exit 1
          fi
          echo "Found $count review comment(s) posted by this run."
