name: PR Check

# tsc + tests on every PR to main. This is the merge gate and costs no API
# credit. AI review of PRs is handled locally by no-mistakes before a PR is
# opened, so there is deliberately no claude-code-action review job here — it
# would only duplicate that review at API cost. claude-code-action is used
# solely for the issue-triggered bug-fix loop (claude-bug-fix.yml), which has
# no local equivalent.

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-check-${{ github.head_ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
