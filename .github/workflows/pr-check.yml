name: PR Check

# tsc + tests on every PR to main. This is the merge gate and costs no API
# credit. AI review of PRs is handled locally by no-mistakes before a PR is
# opened, so there is deliberately no claude-code-action review job here — it
# would only duplicate that review at API cost. claude-code-action is used
# solely for the issue-triggered bug-fix loop (claude-bug-fix.yml), which has
# no local equivalent.

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-check-${{ github.head_ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # AI review stage (idea borrowed from no-mistakes' pipeline): reviews the
  # diff and posts findings as a PR comment. Runs in parallel with `check`
  # and also covers PRs opened by the bug-fix loop, so agent-written fixes
  # get a second agent's review before Paul's.
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-review-${{ github.head_ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Note: claude-code-action skips PRs that modify this workflow file
      # (its own anti-tampering check), so the review does not run on CI-only
      # PRs like this one. It runs on normal PRs (a real bug fix, etc).
      #
      # The review is advisory - `check` is the merge gate. The action exits
      # non-zero for reasons that say nothing about the PR's code: the
      # anti-tampering skip above, an agent-side API error (PR #41 failed this
      # way, `is_error:true` on the first turn, before any tool ran), a
      # timeout. Left un-guarded that reds a PR whose code is fine, so the
      # step is continue-on-error and the outcome is reported below instead.
      - uses: anthropics/claude-code-action@v1
        id: review
        continue-on-error: true
        # GH_TOKEN authenticates the `gh` CLI inside the agent's shell. Without
        # it `gh pr comment` fails silently and the review posts nothing (the
        # #38 failure). claude-code-action does not enable Bash by default, so
        # the gh commands are opt-in through the --allowedTools list below.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in this repo.

            Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`.
            Review ONLY the changed code, judged against the repo rules in
            CLAUDE.md. Focus, in priority order:

            1. Correctness bugs: logic errors, unhandled error paths, broken
               DynamoDB key patterns (see CLAUDE.md table), responses not
               going through src/lib/response.js helpers.
            2. Ownership enforcement: every dog/owner endpoint must verify
               `dog.ownerId === userId` from JWT claims before acting.
               Missing checks are a finding, always.
            3. Security: secrets in code, unvalidated user input reaching
               DynamoDB keys or S3 keys, IAM statements broader than the
               function needs.
            4. Tests: changed behavior without a covering test.

            Your REQUIRED final step, no matter what you find, is to post the
            review as a single sticky comment by running the `gh` CLI:

              gh pr comment ${{ github.event.pull_request.number }} \
                --edit-last --create-if-none --body "<your review>"

            `gh` is already authenticated via GH_TOKEN. `--edit-last
            --create-if-none` updates the previous review comment on re-runs
            instead of stacking a new one. The comment body must be:
            - Findings ordered by severity, each with file:line, what is
              wrong, and a concrete fix. Skip style nits and anything a
              linter or tsc already catches.
            - If nothing significant is found, still post: a one-line comment
              saying the review found no blocking issues.

            Do not end the session without running that command. Never push
            commits, never approve or request changes formally, never edit
            files - comment only.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Read,Glob,Grep"

      # continue-on-error hides the red X, so record the miss somewhere a human
      # looking at the run can see it. No comment is posted from here: a failed
      # review has nothing to say about the diff.
      - name: Report review outcome
        if: steps.review.outcome == 'failure'
        run: |
          echo "The AI review stage did not complete, so this PR has no review comment." >> "$GITHUB_STEP_SUMMARY"
          echo "The \`check\` job still gates the merge. See the claude-code-action step log for why." >> "$GITHUB_STEP_SUMMARY"
