name: Claude Bug Fix

# Bug-intake loop: a maintainer applies the `bug` label to an issue, which
# triggers a Claude agent that reproduces the bug as a failing test, fixes it,
# and opens a PR. If it cannot reproduce or fix, it labels the issue
# `needs-human` and explains why.
#
# SECURITY: the label is applied by a human, NOT auto-applied by the issue form.
# This is deliberate — the repo is public, and the agent runs with broad Bash on
# the issue's text. Requiring a maintainer to apply `bug` means untrusted text
# from a stranger's issue never reaches the agent until a human has vetted it,
# which is what makes the broad `--allowedTools "Bash..."` below acceptable.
# claude-code-action also refuses to run for non-write actors as a second layer.

on:
  issues:
    types: [labeled]

jobs:
  fix:
    if: github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: claude-bug-fix-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        # Step timeout sits well below the job's 55 so the agent running long
        # fails this step rather than timing out the job. A job timeout skips
        # every remaining step, which would swallow the failure handler below.
        # The 15-minute gap covers checkout, npm ci, and the handler itself.
        timeout-minutes: 40
        # GH_TOKEN authenticates the `gh` CLI inside the agent's shell. Without
        # it `gh pr create` and `gh issue comment` fail silently: the loop can
        # still push (checkout persists git credentials) but opens no PR and
        # reports nothing back on the issue.
        #
        # Uses the built-in GITHUB_TOKEN, NOT a PAT. The agent runs with broad
        # Bash on untrusted issue text, and claude-code-action's own security
        # guidance warns a static PAT can be recovered over time via prompt
        # injection; the built-in token is ephemeral (expires per run) so there
        # is nothing durable to steal. Tradeoff: PRs this loop opens with the
        # built-in token do NOT trigger pr-check.yml (GitHub suppresses workflow
        # triggers for GITHUB_TOKEN events), so a maintainer nudges a loop PR
        # (empty commit or reopen) to run the check + review jobs.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the bug-fix loop for this repo. Work on issue #${{ github.event.issue.number }}.

            Read the issue body first. It follows a template: endpoint, what the
            reporter did, expected, actual, stage.

            Follow this sequence strictly:

            1. REPRODUCE. Write a failing test that captures the reported
               behavior (unit test in tests/lib or integration test in
               tests/integration, matching existing test conventions). Run it
               and confirm it fails for the reported reason. If you cannot
               reproduce the bug, STOP: comment on the issue explaining what
               you tried and why it did not reproduce, add the `needs-human`
               label, and do not change any source code.
            2. FIX. Find the root cause and make the smallest fix that makes
               the failing test pass. Respect CLAUDE.md rules (ownership
               checks, response helpers, DynamoDB key patterns).
            3. VERIFY. Run `npx tsc --noEmit` and `npm test`. Both must be
               fully green. Never weaken, skip, or delete an existing test to
               get there.
            4. SHIP. Create a branch `bugfix/issue-${{ github.event.issue.number }}`,
               commit the test + fix, open a PR against the repo's default
               branch titled `fix: <short description> (#${{ github.event.issue.number }})`.
               The PR body must state: root cause, the fix, and which tests
               prove it. Link the issue so it closes on merge.
            5. REPORT. Comment on the issue with a short summary: root cause,
               PR link, what the reporter should re-test.

            If after 3 distinct fix attempts the test suite is still not green,
            stop: revert to a clean state, comment on the issue with what you
            found and where you got stuck, and add the `needs-human` label.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      # The agent's own comment+needs-human fallback lives in its prompt, so it
      # cannot fire when the agent process itself dies (API error, timeout,
      # npm ci failure, tool denial). This leaves a trace on the issue for every
      # non-zero exit instead of failing silently.
      - name: Report failure on the issue
        if: failure()
        # GH_REPO keeps this working even when actions/checkout is what failed;
        # without it `gh` resolves the repo from the git remote. The label goes
        # first and both calls tolerate failure, so a flaky comment API cannot
        # cost the machine-readable escalation signal.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --add-label needs-human || true
          gh issue comment "$ISSUE" --body "The automated bug-fix run exited unexpectedly and may not have completed. A maintainer will follow up. Before re-filing, check the run log and whether a \`bugfix/issue-$ISSUE\` branch or PR already exists. Run log: $RUN_URL" || true
